name: FRIB tests and security
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Locate source directory
        id: source
        shell: bash
        run: |
          if [ -f pyproject.toml ]; then echo "path=." >> "$GITHUB_OUTPUT"
          elif [ -f FRIB_Decision_Support/pyproject.toml ]; then echo "path=FRIB_Decision_Support" >> "$GITHUB_OUTPUT"
          else echo "path=FRIB_Final_Project/FRIB_Decision_Support" >> "$GITHUB_OUTPUT"; fi
      - name: Install declared dependencies
        working-directory: ${{ steps.source.outputs.path }}
        run: |
          python -m pip install --upgrade 'pip>=26.1.2'
          python -m pip install -e '.[ui,dev,security]'
      - name: Run complete suite
        working-directory: ${{ steps.source.outputs.path }}
        run: python -m pytest -q --junitxml=tests.xml
      - name: Scan source
        working-directory: ${{ steps.source.outputs.path }}
        run: python -m bandit -r src start.py scripts -ll -ii
      - name: Audit dependencies
        run: python -m pip_audit --skip-editable --progress-spinner off
