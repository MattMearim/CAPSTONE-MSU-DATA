[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frib-decision-support"
version = "0.4.0"
description = "Field-agnostic human-supervised engineering decision-support POC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "PyYAML>=6.0",
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "requests>=2.32",
  "python-multipart>=0.0.9",
  "pypdf>=5.0",
]

[project.optional-dependencies]
rag = [
  "chromadb>=0.5",
  "sentence-transformers>=3.0",
  "pypdf>=5.0",
]
ui = [
  "streamlit>=1.64",
  "plotly>=5.24",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "httpx>=0.27",
]

[project.scripts]
frib-start = "frib_ds.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"frib_ds.dashboard" = ["*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
